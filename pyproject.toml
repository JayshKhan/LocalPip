[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localpip"
version = "0.2.0"
description = "Offline-capable Python package downloader (CLI + optional GUI). Stdlib + packaging only."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Jaysh Khan"},
]
keywords = ["pip", "offline", "wheel", "pypi", "air-gapped"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = [
    "packaging>=21",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
test = ["pytest>=7", "pytest-cov"]
test-gui = ["pytest-qt"]
dev = ["pytest>=7", "pytest-cov", "pytest-qt", "PyQt5>=5.15"]

[project.urls]
Homepage = "https://github.com/JayshKhan/LocalPip"
Issues = "https://github.com/JayshKhan/LocalPip/issues"

[project.scripts]
localpip = "localpip.cli:main"

[project.gui-scripts]
localpip-gui = "localpip.gui:main"

[tool.setuptools.packages.find]
include = ["localpip*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

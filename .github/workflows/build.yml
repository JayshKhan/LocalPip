name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-cli:
    name: CLI tests (no GUI deps)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package (CLI only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint imports — verify CLI core is GUI-free
        run: |
          python -c "import localpip.core, localpip.cli; print('ok')"
          # Ensure we did NOT pull PyQt5 transitively
          python -c "import importlib, sys; sys.exit(0 if importlib.util.find_spec('PyQt5') is None else 1)"

      - name: Run non-GUI tests
        run: |
          pytest tests/test_config.py tests/test_wheels.py tests/test_resolver.py tests/test_downloader.py tests/test_cli.py -v

      - name: Smoke test CLI
        run: |
          localpip --version
          localpip --help

  test-gui:
    name: GUI tests
    needs: test-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1-mesa-glx

      - name: Install package with GUI extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,test,test-gui]"

      - name: Run all tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_QT_API: pyqt5
        run: pytest tests/ -v --cov=localpip --cov-report=term-missing

  build:
    name: Build PyInstaller binary
    needs: [test-cli, test-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: LocalPip-macOS
          - os: windows-latest
            artifact: LocalPip-Windows
          - os: ubuntu-latest
            artifact: LocalPip-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libegl1 libgl1-mesa-glx

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller

      - name: Build executable
        run: pyinstaller LocalPip.spec

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../LocalPip-macOS.zip LocalPip.app

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: LocalPip-macOS.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/LocalPip.exe

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/LocalPip

  publish-pypi:
    name: Publish to PyPI
    needs: [test-cli, test-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/LocalPip-macOS/LocalPip-macOS.zip
            artifacts/LocalPip-Windows/LocalPip.exe
            artifacts/LocalPip-Linux/LocalPip
          generate_release_notes: true
